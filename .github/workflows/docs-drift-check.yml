name: Docs Drift Check
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest (needed for collection-count check)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Check documentation drift
        run: |
          python scripts/check_docs_drift.py --repo-root "$GITHUB_WORKSPACE"
